[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
nosy-model = { path = "crates/nosy-model" }
nosy-ca = { path = "crates/nosy-ca" }
nosy-proxy = { path = "crates/nosy-proxy" }
nosy-store = { path = "crates/nosy-store" }
nosy-repeater = { path = "crates/nosy-repeater" }
nosy-codec = { path = "crates/nosy-codec" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "1.12", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
http = "1.5"
http-body = "1.1"
http-body-util = "0.1.5"
bytes = "1.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "webpki-tokio", "logging"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
quick_cache = "0.7"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br", "trace"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat"] }
httparse = "1.10"
flate2 = "1.1"
brotli = "9"
zstd = "0.14"
rust-embed = { version = "8.13", features = ["interpolate-folder-path"] }
mime_guess = "2"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
mimalloc = { version = "0.1", default-features = false }
thiserror = "2"
anyhow = "1"
directories = "6"
time = { version = "0.3", features = ["formatting"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
base64 = "0.23"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
memchr = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
